apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  namespace: openshell-keycloak
data:
  openshell-realm.json: |
    {
      "realm": "openshell",
      "enabled": true,
      "sslRequired": "none",
      "registrationAllowed": false,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "resetPasswordAllowed": false,
      "editUsernameAllowed": false,
      "bruteForceProtected": true,
      "defaultRoles": ["openshell-user"],
      "roles": {
        "realm": [
          {
            "name": "openshell-admin",
            "description": "Full admin access to OpenShell gateway"
          },
          {
            "name": "openshell-user",
            "description": "Standard user access to OpenShell sandboxes"
          }
        ]
      },
      "clients": [
        {
          "clientId": "openshell-cli",
          "name": "OpenShell CLI",
          "enabled": true,
          "publicClient": true,
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "protocol": "openid-connect",
          "redirectUris": [
            "http://127.0.0.1:*",
            "http://localhost:*"
          ],
          "webOrigins": ["+"],
          "defaultClientScopes": [
            "openid",
            "profile",
            "email",
            "roles"
          ],
          "attributes": {
            "pkce.code.challenge.method": "S256"
          }
        },
        {
          "clientId": "openclaw-ui",
          "name": "OpenClaw UI (oauth2-proxy)",
          "enabled": true,
          "publicClient": false,
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true,
          "serviceAccountsEnabled": false,
          "protocol": "openid-connect",
          "secret": "PLACEHOLDER_OPENCLAW_UI_SECRET",
          "redirectUris": [
            "https://openclaw-ui.apps.ocp.sandbox315.opentlc.com/oauth2/callback"
          ],
          "webOrigins": [
            "https://openclaw-ui.apps.ocp.sandbox315.opentlc.com"
          ],
          "defaultClientScopes": [
            "openid",
            "profile",
            "email",
            "roles"
          ],
          "attributes": {
            "pkce.code.challenge.method": "S256"
          },
          "protocolMappers": [
            {
              "name": "audience-mapper",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "config": {
                "included.client.audience": "openclaw-ui",
                "id.token.claim": "true",
                "access.token.claim": "true"
              }
            }
          ]
        }
      ],
      "identityProviders": [
        {
          "alias": "openshift",
          "displayName": "Login with OpenShift",
          "providerId": "oidc",
          "enabled": true,
          "trustEmail": true,
          "firstBrokerLoginFlowAlias": "first broker login",
          "config": {
            "clientId": "keycloak-broker",
            "clientSecret": "PLACEHOLDER_REPLACED_BY_DEPLOY_SCRIPT",
            "tokenUrl": "https://oauth-openshift.apps.ocp.sandbox315.opentlc.com/oauth/token",
            "authorizationUrl": "https://oauth-openshift.apps.ocp.sandbox315.opentlc.com/oauth/authorize",
            "userInfoUrl": "https://oauth-openshift.apps.ocp.sandbox315.opentlc.com/apis/user.openshift.io/v1/users/~",
            "defaultScope": "user:info user:check-access",
            "syncMode": "FORCE",
            "validateSignature": "false",
            "clientAuthMethod": "client_secret_post"
          }
        }
      ],
      "identityProviderMappers": [
        {
          "name": "username-mapper",
          "identityProviderAlias": "openshift",
          "identityProviderMapper": "oidc-username-idp-mapper",
          "config": {
            "template": "${ALIAS}.${CLAIM.preferred_username}",
            "syncMode": "INHERIT"
          }
        },
        {
          "name": "admin-role-mapper",
          "identityProviderAlias": "openshift",
          "identityProviderMapper": "hardcoded-role-idp-mapper",
          "config": {
            "role": "openshell-admin",
            "syncMode": "INHERIT"
          }
        }
      ],
      "users": [
        {
          "username": "admin",
          "enabled": true,
          "email": "admin@openshell.local",
          "firstName": "Admin",
          "lastName": "User",
          "credentials": [
            {
              "type": "password",
              "value": "admin",
              "temporary": false
            }
          ],
          "realmRoles": ["openshell-admin", "openshell-user"]
        },
        {
          "username": "user",
          "enabled": true,
          "email": "user@openshell.local",
          "firstName": "Standard",
          "lastName": "User",
          "credentials": [
            {
              "type": "password",
              "value": "user",
              "temporary": false
            }
          ],
          "realmRoles": ["openshell-user"]
        }
      ]
    }
