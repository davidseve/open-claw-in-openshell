version: 1

filesystem_policy:
  include_workdir: false
  read_only: [/usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log, /sandbox]
  read_write: [/sandbox/workspace, /tmp, /dev/null, /home]

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  maas_inference:
    name: red-hat-maas-litellm
    endpoints:
      - host: "maas-rhdp.apps.maas.redhatworkshops.io"
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
        request_body_credential_rewrite: true
    binaries:
      - { path: /usr/bin/node }
      - { path: /usr/bin/curl }

  observability:
    name: otel-collector-traces
    endpoints:
      - host: "otel-collector.observability.svc"
        port: 4318
        protocol: rest
        enforcement: enforce
        access: read-write
      - host: "otel-collector.observability.svc"
        port: 4317
        protocol: rest
        enforcement: enforce
        access: read-write
      - host: "mlflow.observability.svc"
        port: 5000
        protocol: rest
        enforcement: enforce
        access: read-write
    binaries:
      - { path: /usr/bin/node }
      - { path: /usr/bin/curl }
