# ServiceAccount acting as the OAuth client for oauth-proxy's `openshift`
# provider. The annotation registers the Route below as a valid redirect URI
# via the OAuthRedirectReference mechanism, so no cluster-scoped OAuthClient
# is required (unlike the retired charts/keycloak/templates/oauthclient.yaml,
# which is still needed for Keycloak's own OCP identity-broker OAuthClient,
# a separate concern from this Route's redirect URI).
#
# See ADR-0016 for why this replaced the Keycloak-brokered oauth2-proxy setup.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openclaw-ui-oauth-proxy
  namespace: {{ .Values.namespace }}
  annotations:
    serviceaccounts.openshift.io/oauth-redirectreference.primary: >-
      {"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"openclaw-ui-auth"}}
