service:
  name: mlflow-db
namespace: redhat-ods-applications
port: 5432

image:
  repository: registry.redhat.io/rhel9/postgresql-16
  tag: latest

database:
  name: mlflow
  user: mlflow
  # Never commit secrets to git (AGENTS.md). Left blank here on purpose —
  # scripts/deploy-rhoai-mlflow.sh generates/loads this from
  # secrets/secrets.env and injects it via `helm --set-string`.
  password: ""

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"
