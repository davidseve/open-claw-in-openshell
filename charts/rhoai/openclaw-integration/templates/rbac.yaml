{{/*
The mlflow-integration ClusterRole is generated by the RHOAI MLflow operator
with a random-suffixed name (e.g. mlflow-operator-mlflow-integration-xxxxx),
so it can't be hardcoded. Auto-detect it via `lookup` (only works against a
live cluster — `helm template`/`--dry-run` will render an empty match and
fail below) unless an explicit override is given. Ported from
agentops-example's equivalent template (2026-08-05).
*/}}
{{- $clusterRoleName := .Values.clusterRoleName }}
{{- if not $clusterRoleName }}
  {{- range (lookup "rbac.authorization.k8s.io/v1" "ClusterRole" "" "").items }}
    {{- if and (not $clusterRoleName) (contains "mlflow-integration" .metadata.name) }}
      {{- $clusterRoleName = .metadata.name }}
    {{- end }}
  {{- end }}
{{- end }}
{{- if not $clusterRoleName }}
{{- fail "could not auto-detect the mlflow-integration ClusterRole (is the RHOAI MLflow operator installed and reconciled? or `helm template`/dry-run was used, where `lookup` can't see the live cluster). Override explicitly: --set clusterRoleName=$(oc get clusterroles -o name | grep mlflow-integration | cut -d/ -f2)" }}
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.serviceAccountName }}-rhoai-mlflow-integration
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openclaw-mlflow-integration.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $clusterRoleName }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccountName }}
    namespace: {{ .Values.namespace }}
---
# Long-lived SA token Secret (kubernetes.io/service-account-token). Trade-off
# vs. an imperative `oc create token --duration=24h`: this token does not
# expire on its own — it is only invalidated if the Secret or the
# ServiceAccount is deleted. Accepted here for declarative reproducibility
# (AGENTS.md still applies: rotate by deleting this Secret and re-running
# `helm upgrade`, which recreates it with a fresh token).
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.serviceAccountName }}-mlflow-token
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openclaw-mlflow-integration.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/service-account.name: {{ .Values.serviceAccountName }}
type: kubernetes.io/service-account-token
