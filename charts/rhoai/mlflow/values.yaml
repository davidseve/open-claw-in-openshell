postgresql:
  host: mlflow-db.redhat-ods-applications.svc
  port: 5432
  user: mlflow
  # Never commit secrets to git (AGENTS.md). Left blank here on purpose —
  # scripts/deploy-rhoai-mlflow.sh generates/loads this from
  # secrets/secrets.env and injects it via `helm --set-string`. Must match
  # ../database's database.password (same generated value).
  password: ""
  database: mlflow

mlflow:
  enabled: true
  name: mlflow
  replicas: 1
  serveArtifacts: true
  artifactsDestination: "file:///mlflow/artifacts"
  storage:
    size: 10Gi
  route:
    enabled: true

# openclawIntegration: declarative RBAC + SA token + experiment provisioning
# for wiring the mlflow-openclaw plugin's tracing at RHOAI-managed MLflow —
# the sole tracing backend for this project (docs/adrs/ADR-0018-rhoai-mlflow-sole-backend.md). Defaults to false here (a fresh `make -C
# charts/rhoai deploy-all` on its own — RHOAI+MLflow only, no OpenShell — must
# not touch a namespace/SA that doesn't exist yet); scripts/deploy-rhoai-mlflow.sh's caller (scripts/crc-lifecycle.sh) always follows up with
# scripts/wire-rhoai-mlflow-tracing.sh, which flips this on via
# `helm upgrade --set openclawIntegration.enabled=true` once OpenShell + the
# openshell-sandbox SA exist. Not an opt-in experiment anymore — every deploy
# of this project ends with this enabled.
openclawIntegration:
  enabled: false
  # Namespace where OpenShell/the openshell-sandbox SA lives — NOT this
  # chart's own namespace (redhat-ods-applications). The RoleBinding must
  # live here because RHOAI MLflow's self_subject_access_review RBAC check
  # (MLFLOW_K8S_AUTH_AUTHORIZATION_MODE) is scoped by namespace, and the
  # X-MLFLOW-WORKSPACE header value below must match it.
  namespace: openshell
  serviceAccountName: openshell-sandbox
  # mlflow-integration ClusterRole name varies by operator build (observed
  # form: a generated name ending in "-mlflow-integration"). Left empty by
  # default — scripts/wire-rhoai-mlflow-tracing.sh detects the live name via
  # `oc get clusterroles` and passes it with --set at deploy time, since
  # Helm templates should not guess an operator-versioned generated name.
  clusterRoleName: ""
  experimentName: openclaw-tracing
  # MLflow namespace/Service this cluster's MLflow actually runs in — used by
  # the experiment-provisioning Job to build the in-cluster Service URL.
  mlflowNamespace: redhat-ods-applications
  # Small, version-pinned image with curl — the experiment-provisioning Job
  # only needs to speak HTTPS to MLflow's REST API, not a full toolchain.
  jobImage: "docker.io/curlimages/curl:8.10.1"
