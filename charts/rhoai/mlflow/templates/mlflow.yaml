{{- if .Values.mlflow.enabled }}
apiVersion: mlflow.opendatahub.io/v1
kind: MLflow
metadata:
  name: {{ .Values.mlflow.name }}
  labels:
    {{- include "mlflow.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.mlflow.replicas }}
  backendStoreUriFrom:
    name: mlflow-db-config
    key: db-url
  serveArtifacts: {{ .Values.mlflow.serveArtifacts }}
  artifactsDestination: {{ .Values.mlflow.artifactsDestination | quote }}
  storage:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: {{ .Values.mlflow.storage.size }}
{{- end }}
