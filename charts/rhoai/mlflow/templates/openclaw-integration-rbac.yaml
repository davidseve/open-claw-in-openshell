# RBAC + declarative SA token for wiring the mlflow-openclaw plugin's tracing
# transport to this RHOAI MLflow instance. See values.yaml's
# openclawIntegration block and docs/adrs/ADR-0017-rhoai-mlflow-scope.md.
#
# Replaces the imperative `oc apply` heredoc + `oc create token --duration=24h`
# previously done ad hoc by scripts/wire-rhoai-mlflow-tracing.sh: both
# resources below now live in this chart's normal `helm upgrade --install`
# lifecycle (charts/rhoai/Makefile's deploy-mlflow target already runs this
# on every deploy).
{{- if .Values.openclawIntegration.enabled }}
{{- if not .Values.openclawIntegration.clusterRoleName }}
{{- fail "openclawIntegration.enabled=true requires openclawIntegration.clusterRoleName (detect it with: oc get clusterroles -o name | grep mlflow-integration)" }}
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.openclawIntegration.serviceAccountName }}-rhoai-mlflow-integration
  namespace: {{ .Values.openclawIntegration.namespace }}
  labels:
    {{- include "mlflow.labels" . | nindent 4 }}
    app.kubernetes.io/part-of: openclaw-in-openshell
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.openclawIntegration.clusterRoleName }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.openclawIntegration.serviceAccountName }}
    namespace: {{ .Values.openclawIntegration.namespace }}
---
# Legacy long-lived SA token Secret (kubernetes.io/service-account-token).
# Trade-off vs. the previous `oc create token --duration=24h`: this token
# does not expire on its own — it is only invalidated if the Secret or the
# ServiceAccount is deleted. Accepted here for declarative reproducibility
# (AGENTS.md still applies: "Rotate credentials periodically" — rotate by
# deleting this Secret and re-running `helm upgrade`, which recreates it with
# a fresh token).
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.openclawIntegration.serviceAccountName }}-mlflow-token
  namespace: {{ .Values.openclawIntegration.namespace }}
  labels:
    {{- include "mlflow.labels" . | nindent 4 }}
    app.kubernetes.io/part-of: openclaw-in-openshell
  annotations:
    kubernetes.io/service-account.name: {{ .Values.openclawIntegration.serviceAccountName }}
type: kubernetes.io/service-account-token
{{- end }}
