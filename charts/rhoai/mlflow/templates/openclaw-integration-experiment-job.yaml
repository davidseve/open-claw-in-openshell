# Idempotent get-by-name-or-create for the openclaw-tracing MLflow experiment,
# run as a Helm post-install/post-upgrade hook instead of a separate
# imperative script step (see values.yaml's openclawIntegration block and
# docs/adrs/ADR-0017-rhoai-mlflow-scope.md).
#
# MLflow experiments are a "pseudo-resource" (no CRD — created purely via the
# MLflow REST API), so this can't be a plain declarative manifest; wrapping
# it as a Job keeps it inside the chart's normal install/upgrade lifecycle
# instead of a hand-run script step.
#
# Auth: uses the SA token Secret from openclaw-integration-rbac.yaml (same
# Bearer token the sandbox's mlflow-openclaw plugin uses at runtime) plus the
# X-MLFLOW-WORKSPACE header RHOAI's MLflow requires (--enable-workspaces is
# always on). curl -k (skip verify) is intentional and safe here: this Job
# talks to MLflow's in-cluster Service directly over normal pod networking —
# it never goes through the OpenShell sandbox's L7 proxy (tls: skip in
# policies/openclaw-sandbox.yaml is a separate, sandbox-only concern) — and
# it never leaves the cluster network.
#
# Result is written to stdout as `experiment_id=<N>`; the caller
# (scripts/wire-rhoai-mlflow-tracing.sh) reads it back with
# `oc logs job/<name>` rather than needing kubectl/oc inside this minimal
# curl-only image.
{{- if .Values.openclawIntegration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: openclaw-mlflow-experiment-{{ .Release.Revision }}
  namespace: {{ .Values.openclawIntegration.namespace }}
  labels:
    {{- include "mlflow.labels" . | nindent 4 }}
    app.kubernetes.io/part-of: openclaw-in-openshell
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "mlflow.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: create-experiment
          image: {{ .Values.openclawIntegration.jobImage }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              TOKEN=$(cat /var/run/secrets/mlflow-token/token)
              MLFLOW_URL="https://mlflow.{{ .Values.openclawIntegration.mlflowNamespace }}.svc.cluster.local:8443"
              WORKSPACE="{{ .Values.openclawIntegration.namespace }}"
              EXP_NAME="{{ .Values.openclawIntegration.experimentName }}"

              # NOTE: MLflow's JSON responses pretty-print with a space after
              # the colon ("experiment_id": "1") — the extraction regex below
              # must tolerate that (confirmed live: a colon-with-no-space
              # pattern silently failed to match, making a perfectly valid
              # get-by-name response look empty and causing a spurious
              # RESOURCE_ALREADY_EXISTS on the fallback create call).
              RESP=$(curl -sk \
                -H "Authorization: Bearer ${TOKEN}" \
                -H "X-MLFLOW-WORKSPACE: ${WORKSPACE}" \
                "${MLFLOW_URL}/api/2.0/mlflow/experiments/get-by-name?experiment_name=${EXP_NAME}")
              EXP_ID=$(echo "$RESP" | grep -o '"experiment_id"[[:space:]]*:[[:space:]]*"[0-9]*"' | grep -o '[0-9]*' | head -1)

              if [ -z "$EXP_ID" ]; then
                RESP=$(curl -sk -X POST \
                  -H "Authorization: Bearer ${TOKEN}" \
                  -H "X-MLFLOW-WORKSPACE: ${WORKSPACE}" \
                  -H "Content-Type: application/json" \
                  -d "{\"name\": \"${EXP_NAME}\"}" \
                  "${MLFLOW_URL}/api/2.0/mlflow/experiments/create")
                EXP_ID=$(echo "$RESP" | grep -o '"experiment_id"[[:space:]]*:[[:space:]]*"[0-9]*"' | grep -o '[0-9]*' | head -1)
              fi

              if [ -z "$EXP_ID" ]; then
                echo "ERROR: could not get-or-create experiment. Last response: $RESP" >&2
                exit 1
              fi
              echo "experiment_id=${EXP_ID}"
          volumeMounts:
            - name: mlflow-token
              mountPath: /var/run/secrets/mlflow-token
              readOnly: true
      volumes:
        - name: mlflow-token
          secret:
            secretName: {{ .Values.openclawIntegration.serviceAccountName }}-mlflow-token
{{- end }}
